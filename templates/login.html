<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - Task Board</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    {% include "header.html" %}
    <div class="container auth-page">

        <div class="form-title">
            <h1>Welcome back</h1>
            <p>Log in to see your tasks</p>
        </div>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <div class="flash">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        <div class="form-card auth-card">
            <form method="post">
                <!-- CSRF TOKEN GOES HERE -->

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com">

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••">

                <button type="submit" class="btn btn-full">Log in</button>
            </form>
        </div>

        <p class="auth-switch">No account yet? <a href="{{ url_for('register') }}">Sign up</a></p>

    </div>

    <!-- Footer -->
    <footer>
        <p>☑️ Task Board - Built with Python & Flask</p>
    </footer>

</body>

</html>
